name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: lint, tests and style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install root tooling
        run: bun install --frozen-lockfile

      - name: Install _core dependencies
        # The Open Graph tests render through the fonts installed by _core.
        working-directory: versions/_core
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun x biome ci .

      - name: Unit tests
        run: bun test

      - name: Editorial style rules
        run: bun scripts/check-style.ts

  variant:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      # One failing variant must not hide the state of the others.
      fail-fast: false
      matrix:
        variant:
          - _core
          - motion-primitives
          - cult-ui
          - aceternity
          - reactbits
          - organique
          - h4x0r
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install root tooling
        run: bun install --frozen-lockfile

      - name: Install variant dependencies
        working-directory: versions/${{ matrix.variant }}
        run: bun install --frozen-lockfile

      - name: Typecheck, build, links, assets and Open Graph
        run: bun scripts/check-variants.ts ${{ matrix.variant }}

  dependencies:
    name: dependencies up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Report outdated dependencies
        # Informational: the project targets the latest of everything, but a
        # fresh upstream release must not turn every pull request red.
        continue-on-error: true
        run: |
          for variant in versions/*/; do
            echo "== ${variant}"
            (cd "${variant}" && bun install --frozen-lockfile >/dev/null && bun outdated)
          done
