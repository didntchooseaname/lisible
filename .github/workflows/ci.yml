name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      packages: ${{ steps.filter.outputs.packages }}
      organique: ${{ steps.filter.outputs.organique }}
      h4x0r: ${{ steps.filter.outputs.h4x0r }}
      variants: ${{ steps.variants.outputs.variants }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            shared:
              - '**'
              - '!versions/**'
            packages:
              - 'packages/**'
            _core:
              - 'versions/_core/**'
            motion-primitives:
              - 'versions/motion-primitives/**'
            cult-ui:
              - 'versions/cult-ui/**'
            aceternity:
              - 'versions/aceternity/**'
            reactbits:
              - 'versions/reactbits/**'
            organique:
              - 'versions/organique/**'
            h4x0r:
              - 'versions/h4x0r/**'

      - name: Compute the variant matrix
        # The matrix context is not available in a job-level if, so the list
        # of variants to build is precomputed here and consumed as a dynamic
        # matrix by the variant job.
        id: variants
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
          SHARED: ${{ steps.filter.outputs.shared }}
        run: |
          all='["_core","motion-primitives","cult-ui","aceternity","reactbits","organique","h4x0r"]'
          if [ "$SHARED" = "true" ]; then
            list="$all"
          else
            list="$(jq -c --argjson all "$all" '[.[] | select(IN($all[]))]' <<<"$CHANGES")"
          fi
          echo "variants=$list" >> "$GITHUB_OUTPUT"

  quality:
    name: lint, tests and style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install workspace dependencies
        # One install covers the root tooling, the shared core and every
        # variant, including the fonts the Open Graph tests render through.
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun x biome ci .

      - name: Unit tests
        run: bun test

      - name: Editorial style rules
        run: bun scripts/check-style.ts

  variant:
    name: ${{ matrix.variant }}
    needs: changes
    # A matrix must not expand empty, so the job is skipped outright when no
    # variant is affected.
    if: ${{ needs.changes.outputs.variants != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      # One failing variant must not hide the state of the others.
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.changes.outputs.variants) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, build, links, assets and Open Graph
        run: bun scripts/check-variants.ts ${{ matrix.variant }}

      - name: Share the built dist with the downstream jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-${{ matrix.variant }}
          path: versions/${{ matrix.variant }}/dist
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: end to end (organique and h4x0r)
    needs: [changes, variant]
    if: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.organique == 'true' || needs.changes.outputs.h4x0r == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Download the dists built by the variant matrix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: dist-*
          path: artifacts

      - name: Restore the tested variants, building the ones the matrix skipped
        run: |
          for variant in organique h4x0r; do
            if [ -d "artifacts/dist-${variant}" ]; then
              rm -rf "versions/${variant}/dist"
              mkdir -p "versions/${variant}/dist"
              cp -R "artifacts/dist-${variant}/." "versions/${variant}/dist/"
            else
              (cd "versions/${variant}" && bun run build)
            fi
          done

      - name: Install chromium
        run: bun x playwright install --with-deps chromium

      - name: Playwright
        run: bun run test:e2e

  lighthouse:
    name: lighthouse budgets (organique)
    needs: [changes, variant]
    if: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.organique == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Download the organique dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: dist-organique
          path: artifacts

      - name: Restore the dist, building it if the matrix skipped organique
        run: |
          if [ -d "artifacts/dist-organique" ]; then
            rm -rf versions/organique/dist
            mkdir -p versions/organique/dist
            cp -R artifacts/dist-organique/. versions/organique/dist/
          else
            (cd versions/organique && bun run build)
          fi

      - name: Lighthouse
        run: bun x @lhci/cli autorun --collect.staticDistDir=versions/organique/dist

  cli-smoke:
    name: scaffolding cli smoke test
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install workspace dependencies
        # create-lisible reaches lisible/bin.mjs through the workspace link,
        # so even the help output needs node_modules in place.
        run: bun install --frozen-lockfile

      - name: Help output of both binaries
        run: |
          node packages/lisible/bin.mjs --help
          node packages/create-lisible/bin.mjs --help

      - name: Scaffold a blog end to end
        # The full scaffold clones the published repository and installs the
        # workspace, so it only runs when the packages themselves change.
        if: ${{ needs.changes.outputs.packages == 'true' }}
        run: |
          node packages/lisible/bin.mjs "$RUNNER_TEMP/smoke-blog" --yes --variant organique --title "Smoke"
          test -f "$RUNNER_TEMP/smoke-blog/lisible.config.json"

  check-drift:
    name: rendering drift against the baseline
    needs: [changes, variant]
    # The comparison needs all seven dists, which only exist when a shared
    # change runs the full matrix. Variant scoped pull requests rely on the
    # local check instead.
    if: ${{ needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Download the dists built by the variant matrix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: dist-*
          path: artifacts

      - name: Restore every dist
        run: |
          for variant in _core aceternity cult-ui h4x0r motion-primitives organique reactbits; do
            rm -rf "versions/${variant}/dist"
            mkdir -p "versions/${variant}/dist"
            cp -R "artifacts/dist-${variant}/." "versions/${variant}/dist/"
          done

      - name: Compare against the committed baseline
        # The drifting pages are surfaced as annotations: they are readable
        # from the run page and the public API, while raw logs are not.
        run: |
          status=0
          bun scripts/check-drift.ts >drift.log 2>&1 || status=$?
          cat drift.log
          if [ "$status" -ne 0 ]; then
            grep -E "^  - " drift.log | head -10 | sed 's/^  - /::error title=drift::/'
          fi
          exit "$status"

  dependencies:
    name: dependencies up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Report outdated dependencies
        # Informational: the project targets the latest of everything, but a
        # fresh upstream release must not turn every pull request red.
        continue-on-error: true
        run: |
          bun install --frozen-lockfile >/dev/null
          bun outdated --filter "*"
