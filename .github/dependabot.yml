version: 2
updates:
  - package-ecosystem: "bun"
    directories:
      - "/"
      - "/versions/_core"
      - "/versions/aceternity"
      - "/versions/cult-ui"
      - "/versions/h4x0r"
      - "/versions/motion-primitives"
      - "/versions/organique"
      - "/versions/reactbits"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
